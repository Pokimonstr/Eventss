<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.title}">Мероприятие</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{events/fragments/layout :: navbar}"></nav>

<main class="page-container">
    <div th:replace="~{events/fragments/layout :: alerts}"></div>

    <div class="detail-card">
        <div class="event-card-top">
            <span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(event.status.name())}"
                  th:text="${event.status.label}"></span>
            <span class="event-type" th:text="${event.type.label}"></span>
        </div>

        <h1 th:text="${event.title}">Название</h1>
        <p th:text="${event.description}" style="color:var(--text-secondary);margin:1rem 0">Описание</p>

        <div th:replace="~{events/fragments/layout :: tabs(${event}, ${activeTab})}"></div>

        <div class="detail-row"><span class="detail-label">Начало</span><span th:text="${event.startAt} ?: '—'"></span></div>
        <div class="detail-row"><span class="detail-label">Конец</span><span th:text="${event.endAt} ?: '—'"></span></div>
        <div class="detail-row"><span class="detail-label">Место</span><span th:text="${event.locationName} ?: '—'"></span></div>
        <div class="detail-row"><span class="detail-label">Организатор</span><span th:text="${event.ownerName}"></span></div>
        <div class="detail-row"><span class="detail-label">Участников</span><span th:text="${event.participantCount}"></span></div>
        <div class="detail-row"><span class="detail-label">Макс. участников</span><span th:text="${event.maxParticipants} ?: '—'"></span></div>
        <div class="detail-row"><span class="detail-label">Бюджет</span><span th:text="${event.budgetAmount != null ? event.budgetAmount + ' ₽' : '—'}"></span></div>

        <div class="detail-actions">
            <a th:href="@{/events/{id}/edit(id=${event.id})}" class="btn btn-outline">✏️ Редактировать</a>
            <form th:action="@{/events/{id}/delete(id=${event.id})}" method="post"
                  onsubmit="return confirm('Точно удалить?')">
                <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
            </form>
        </div>
    </div>

    <div class="summary-grid">
        <a th:href="@{/events/{id}/expenses(id=${event.id})}" class="summary-card">
            <div class="summary-icon">💸</div>
            <div class="summary-value" th:text="${expensesTotal} + ' ₽'">0 ₽</div>
            <div class="summary-label">потрачено</div>
        </a>
        <a th:href="@{/events/{id}/chat(id=${event.id})}" class="summary-card">
            <div class="summary-icon">💬</div>
            <div class="summary-value" th:text="${chatCount}">0</div>
            <div class="summary-label">сообщений</div>
        </a>
        <a th:href="@{/events/{id}/album(id=${event.id})}" class="summary-card">
            <div class="summary-icon">📸</div>
            <div class="summary-value" th:text="${photoCount}">0</div>
            <div class="summary-label">фото</div>
        </a>
        <a th:href="@{/events/{id}/assistant(id=${event.id})}" class="summary-card">
            <div class="summary-icon">🤖</div>
            <div class="summary-value" th:text="${checklistProgress} + '%'">0%</div>
            <div class="summary-label">чек-лист</div>
        </a>
    </div>

    <div class="feature-panel">
        <h3>Участники</h3>
        <div class="participant-row" th:each="p : ${participants}">
            <span class="participant-name" th:text="${p.displayName}">Имя</span>
            <span class="participant-role" th:text="${p.role}">роль</span>
            <form th:action="@{/events/{id}/participants/{pid}/rsvp(id=${event.id}, pid=${p.participantId})}"
                  method="post" class="inline-form-tight">
                <select name="status" class="filter-select" onchange="this.form.submit()">
                    <option th:each="s : ${rsvpStatuses}" th:value="${s}" th:text="${s}"
                            th:selected="${s == p.rsvpStatus}"></option>
                </select>
            </form>
            <form th:action="@{/events/{id}/participants/{pid}/delete(id=${event.id}, pid=${p.participantId})}"
                  method="post">
                <button type="submit" class="btn btn-danger btn-sm">🗑️</button>
            </form>
        </div>

        <form th:action="@{/events/{id}/participants(id=${event.id})}" method="post" class="inline-form-tight">
            <input type="text" name="displayName" placeholder="Имя участника" required/>
            <button type="submit" class="btn btn-primary">+ Добавить участника</button>
        </form>
    </div>
</main>
</body>
</html>
