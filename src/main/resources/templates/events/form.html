<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма — Let's Go!</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{events/fragments/layout :: navbar}"></nav>

<main class="page-container">
    <div class="form-card">
        <h1 th:text="${form.id == null} ? 'Новое мероприятие' : 'Редактировать'">Форма</h1>

        <form th:object="${form}"
              th:action="${form.id == null} ? @{/events} : @{/events/{id}(id=${form.id})}"
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>Название *</label>
                <input type="text" th:field="*{title}" placeholder="Поход в горы"/>
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>

            <div class="form-group">
                <label>Тип *</label>
                <select th:field="*{type}">
                    <option value="" disabled th:selected="${form.type == null}">Выбери тип...</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
            </div>

            <div class="form-group">
                <label>Описание</label>
                <textarea th:field="*{description}" placeholder="Расскажи, что будет..."></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>

            <div class="form-group">
                <label>Начало</label>
                <input type="datetime-local" th:field="*{startAt}"/>
            </div>

            <div class="form-group">
                <label>Конец</label>
                <input type="datetime-local" th:field="*{endAt}"/>
                <span class="field-error" th:if="${#fields.hasErrors('endAfterStart')}" th:errors="*{endAfterStart}"></span>
            </div>

            <div class="form-group">
                <label>Место</label>
                <input type="text" th:field="*{locationName}" placeholder="Парк Горького"/>
            </div>

            <div class="form-group">
                <label>Макс. участников</label>
                <input type="number" th:field="*{maxParticipants}" min="1"/>
                <span class="field-error" th:if="${#fields.hasErrors('maxParticipants')}" th:errors="*{maxParticipants}"></span>
            </div>

            <div class="form-group">
                <label>Бюджет (₽)</label>
                <input type="number" th:field="*{budgetAmount}" step="0.01" min="0"/>
                <span class="field-error" th:if="${#fields.hasErrors('budgetAmount')}" th:errors="*{budgetAmount}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a th:href="@{/events}" class="btn btn-outline">Отмена</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
